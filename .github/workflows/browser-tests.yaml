# The shinytest2 browser tests, kept out of R-CMD-check.yaml because they
# take most of an hour on a CI runner. Run by hand from the Actions tab (or
# `gh workflow run browser-tests.yaml`) before a release or after changes to
# the apps.
on:
  workflow_dispatch:

name: browser-tests.yaml

permissions: read-all

jobs:
  browser-tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, local::.
          needs: check

      # shinytest2 runs each app in a fresh R process, which loads the
      # installed markermd, so the package is installed before the tests run
      - name: Run the tests, browser tests included
        run: |
          options(crayon.enabled = TRUE)
          devtools::test(stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Upload test snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-snapshots
          path: tests/testthat/_snaps
          if-no-files-found: ignore
